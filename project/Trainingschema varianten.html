<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FORM&FUEL — Mobiele varianten</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ff-bg: #0a0a0b;
    --ff-card: #131316;
    --ff-card-2: #18181c;
    --ff-line: #26262b;
    --ff-line-soft: #1d1d21;
    --ff-amber: #efa320;
    --ff-amber-dim: #b9852a;
    --ff-text: #ededee;
    --ff-muted: #8a8a90;
    --ff-faint: #5a5a60;
    --ff-good: #5bbf7a;
    --ff-sans: 'Space Grotesk', system-ui, sans-serif;
    --ff-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0d0d0f; }

  /* ── FORM&FUEL screen shell inside the iOS frame ───────────── */
  .ff {
    height: 100%;
    background: var(--ff-bg);
    color: var(--ff-text);
    font-family: var(--ff-sans);
    display: flex;
    flex-direction: column;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .ff-body {
    flex: 1;
    overflow: hidden;
    padding: 58px 18px 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .ff-scroll { flex: 1; overflow-y: auto; min-height: 0; margin: 0 -18px; padding: 0 18px 16px; }
  .ff-scroll::-webkit-scrollbar { width: 0; }

  /* top wordmark / context row */
  .ff-top { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 14px; }
  .ff-wordmark { font-family: var(--ff-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.18em; color: var(--ff-text); }
  .ff-wordmark b { color: var(--ff-amber); }
  .ff-date { font-family: var(--ff-mono); font-size: 11px; letter-spacing: 0.16em; color: var(--ff-muted); }

  .ff-label { font-family: var(--ff-mono); font-weight: 700; font-size: 11px; letter-spacing: 0.22em; color: var(--ff-amber); text-transform: uppercase; }
  .ff-sublabel { font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.18em; color: var(--ff-faint); text-transform: uppercase; }

  .ff-h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin: 2px 0 0; }
  .ff-h2 { font-size: 18px; font-weight: 600; margin: 0; }

  /* progress bar */
  .ff-progress { height: 6px; border-radius: 99px; background: var(--ff-line-soft); overflow: hidden; }
  .ff-progress > i { display: block; height: 100%; background: var(--ff-amber); border-radius: 99px; transition: width .35s ease; }

  /* exercise card */
  .ff-ex { background: var(--ff-card); border: 1px solid var(--ff-line); border-radius: 16px; padding: 14px 14px 12px; }
  .ff-ex + .ff-ex { margin-top: 10px; }
  .ff-ex.done { border-color: var(--ff-line-soft); opacity: .62; }
  .ff-ex-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ff-ex-name { font-size: 16px; font-weight: 600; }
  .ff-ex-meta { font-family: var(--ff-mono); font-size: 11px; color: var(--ff-muted); letter-spacing: .04em; }

  /* set chips */
  .ff-sets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .ff-set {
    flex: 1 1 0; min-width: 58px; height: 52px; border-radius: 12px;
    border: 1px solid var(--ff-line); background: var(--ff-card-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; transition: all .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .ff-set .v { font-family: var(--ff-mono); font-size: 14px; font-weight: 700; color: var(--ff-text); line-height: 1; }
  .ff-set .k { font-family: var(--ff-mono); font-size: 9px; letter-spacing: .12em; color: var(--ff-faint); margin-top: 3px; }
  .ff-set.on { background: var(--ff-amber); border-color: var(--ff-amber); }
  .ff-set.on .v { color: #1a1304; }
  .ff-set.on .k { color: #6b5212; }
  .ff-set:active { transform: scale(.96); }

  /* round check */
  .ff-check { width: 26px; height: 26px; border-radius: 99px; border: 2px solid var(--ff-line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ff-check.on { background: var(--ff-amber); border-color: var(--ff-amber); }

  /* big buttons */
  .ff-btn {
    width: 100%; border: none; border-radius: 14px; cursor: pointer;
    font-family: var(--ff-mono); font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
  }
  .ff-btn-primary { background: var(--ff-amber); color: #1a1304; height: 56px; font-size: 14px; }
  .ff-btn-primary:active { background: #d9920f; }
  .ff-btn-ghost { background: transparent; color: var(--ff-amber); border: 1px dashed var(--ff-line); height: 50px; font-size: 12px; }
  .ff-btn-ghost:active { background: var(--ff-card); }

  /* steppers (variant B) */
  .ff-stepper { display: flex; align-items: stretch; gap: 10px; }
  .ff-step-btn {
    width: 66px; height: 66px; border-radius: 16px; border: 1px solid var(--ff-line);
    background: var(--ff-card-2); color: var(--ff-text); font-size: 30px; font-weight: 400;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  }
  .ff-step-btn:active { background: var(--ff-amber); color: #1a1304; border-color: var(--ff-amber); }
  .ff-step-val { flex: 1; background: var(--ff-card); border: 1px solid var(--ff-line); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ff-step-val .n { font-family: var(--ff-mono); font-size: 34px; font-weight: 700; line-height: 1; }
  .ff-step-val .u { font-family: var(--ff-mono); font-size: 10px; letter-spacing: .2em; color: var(--ff-faint); margin-top: 4px; text-transform: uppercase; }

  /* set dots */
  .ff-dots { display: flex; gap: 8px; }
  .ff-dot { width: 11px; height: 11px; border-radius: 99px; background: var(--ff-line); }
  .ff-dot.done { background: var(--ff-amber); }
  .ff-dot.cur { background: transparent; border: 2px solid var(--ff-amber); }

  /* bottom tab bar */
  .ff-tabs {
    display: flex; align-items: stretch; gap: 2px;
    border-top: 1px solid var(--ff-line-soft); background: rgba(10,10,11,.92);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); backdrop-filter: blur(8px);
  }
  .ff-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0 2px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .ff-tab span { font-family: var(--ff-mono); font-size: 9px; letter-spacing: .14em; color: var(--ff-faint); text-transform: uppercase; }
  .ff-tab svg { stroke: var(--ff-faint); }
  .ff-tab.on span { color: var(--ff-amber); }
  .ff-tab.on svg { stroke: var(--ff-amber); }

  /* day strip */
  .ff-days { display: flex; gap: 6px; }
  .ff-day {
    flex: 1; height: 42px; border-radius: 11px; border: 1px solid var(--ff-line);
    background: var(--ff-card); color: var(--ff-muted); cursor: pointer;
    font-family: var(--ff-mono); font-size: 12px; font-weight: 700; letter-spacing: .08em;
    display: flex; align-items: center; justify-content: center; position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .ff-day.on { background: var(--ff-amber); border-color: var(--ff-amber); color: #1a1304; }
  .ff-day .pip { position: absolute; bottom: 6px; width: 4px; height: 4px; border-radius: 99px; background: var(--ff-amber-dim); }
  .ff-day.on .pip { background: #1a1304; }

  /* picker sheet (variant C) */
  .ff-sheet { background: var(--ff-card); border: 1px solid var(--ff-line); border-radius: 18px; padding: 14px; }
  .ff-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .ff-chip {
    border: 1px solid var(--ff-line); background: var(--ff-card-2); color: var(--ff-text);
    border-radius: 99px; padding: 10px 14px; cursor: pointer;
    font-size: 13px; font-weight: 500; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 7px;
  }
  .ff-chip:active { border-color: var(--ff-amber); }
  .ff-chip .plus { font-family: var(--ff-mono); color: var(--ff-amber); font-weight: 700; }
  .ff-search { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--ff-line); background: var(--ff-card-2); color: var(--ff-text); padding: 0 14px; font-family: var(--ff-mono); font-size: 13px; outline: none; }
  .ff-search::placeholder { color: var(--ff-faint); }

  .ff-empty { border: 1px dashed var(--ff-line); border-radius: 16px; padding: 22px 16px; text-align: center; color: var(--ff-muted); font-size: 13px; }

  .ff-rest { position: absolute; inset: 0; background: rgba(8,8,9,.96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; z-index: 30; }
  .ff-rest .num { font-family: var(--ff-mono); font-size: 72px; font-weight: 700; color: var(--ff-amber); letter-spacing: .02em; }

  #root { padding: 0; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0a0a0b"/>
    <text x="50" y="56" font-family="monospace" font-size="13" font-weight="700" fill="#efa320" text-anchor="middle" letter-spacing="1">F&amp;F</text>
  </svg>
</template>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>

</body>
</html>
